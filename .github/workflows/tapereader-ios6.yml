name: TapeReader iOS 6 armv7 build

on:
  push:
    branches:
      - tapereader-build-20260921
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl unzip zip xz-utils lzma make perl python3 dpkg-dev fakeroot file libtinfo5 ca-certificates

      - name: Restore TapeReader source
        run: |
          cat > /tmp/tapereader-source.b64 <<'TAPEREADER_B64'
          
          TAPEREADER_B64
          base64 -d /tmp/tapereader-source.b64 > /tmp/TapeReader-source.zip
          mkdir -p /tmp/tapereader-src
          unzip -q /tmp/TapeReader-source.zip -d /tmp/tapereader-src
          ROOT="$(dirname "$(find /tmp/tapereader-src -maxdepth 3 -type f -name Makefile | head -n1)")"
          test -n "$ROOT"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          sed -i '/^TapeReader_RESOURCE_DIRS[[:space:]]*=/d' "$ROOT/Makefile"
          echo '--- Makefile ---'
          cat "$ROOT/Makefile"

      - name: Install Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install Linux iOS clang toolchain
        run: |
          curl -fL --retry 4 --retry-delay 2             -o /tmp/linux-ios-toolchain.tar.lzma             https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma
          mkdir -p /tmp/linux-ios-toolchain
          tar --lzma -xf /tmp/linux-ios-toolchain.tar.lzma -C /tmp/linux-ios-toolchain
          TOOLCHAIN_ROOT="$(dirname "$(dirname "$(find /tmp/linux-ios-toolchain -type f -path '*/bin/clang' | head -n1)")")"
          test -n "$TOOLCHAIN_ROOT"
          mkdir -p "$HOME/theos/toolchain/linux/iphone"
          cp -a "$TOOLCHAIN_ROOT"/. "$HOME/theos/toolchain/linux/iphone/"
          echo "$HOME/theos/toolchain/linux/iphone/bin" >> "$GITHUB_PATH"
          "$HOME/theos/toolchain/linux/iphone/bin/clang" --version
          find "$HOME/theos/toolchain/linux/iphone/bin" -maxdepth 1 -type f -o -type l | head -40

      - name: Install iPhoneOS 6.1 SDK
        run: |
          curl -fL --retry 4 --retry-delay 2             -o /tmp/iPhoneOS6.1.sdk.zip             https://github.com/growtopiajaw/iPhoneOS-SDK/releases/download/v1.0/iPhoneOS6.1.sdk.zip
          mkdir -p /tmp/sdk-unpack
          unzip -q /tmp/iPhoneOS6.1.sdk.zip -d /tmp/sdk-unpack
          SDKROOT="$(find /tmp/sdk-unpack -type d -name iPhoneOS6.1.sdk | head -n1)"
          test -n "$SDKROOT"
          rm -rf "$HOME/theos/sdks/iPhoneOS6.1.sdk"
          mkdir -p "$HOME/theos/sdks"
          cp -a "$SDKROOT" "$HOME/theos/sdks/iPhoneOS6.1.sdk"
          test -e "$HOME/theos/sdks/iPhoneOS6.1.sdk/System/Library/Frameworks/Foundation.framework/Foundation"
          test -e "$HOME/theos/sdks/iPhoneOS6.1.sdk/System/Library/Frameworks/UIKit.framework/UIKit"
          file "$HOME/theos/sdks/iPhoneOS6.1.sdk/System/Library/Frameworks/Foundation.framework/Foundation" || true
          ls -la "$HOME/theos/sdks/iPhoneOS6.1.sdk/System/Library/Frameworks/Foundation.framework"

      - name: Static validation
        run: |
          cd "$PROJECT_ROOT"
          python3 scripts/validate.py

      - name: Build TapeReader
        run: |
          set -o pipefail
          cd "$PROJECT_ROOT"
          export THEOS="$HOME/theos"
          export PATH="$HOME/theos/toolchain/linux/iphone/bin:$PATH"
          make clean messages=yes 2>&1 | tee /tmp/tapereader-clean.log
          make -j2 messages=yes 2>&1 | tee /tmp/tapereader-build.log
          make package messages=yes 2>&1 | tee /tmp/tapereader-package.log

      - name: Assemble IPA and DEB
        run: |
          set -eux
          OUT=/tmp/tapereader-out
          rm -rf "$OUT"
          mkdir -p "$OUT/Payload"
          APP="$(find "$PROJECT_ROOT" -type d -name TapeReader.app | head -n1)"
          if [ -z "$APP" ]; then
            APP="$(find "$PROJECT_ROOT"/.theos -type d -name TapeReader.app | head -n1)"
          fi
          test -n "$APP"
          cp -a "$APP" "$OUT/Payload/TapeReader.app"
          BIN="$OUT/Payload/TapeReader.app/TapeReader"
          test -f "$BIN"
          if command -v ldid >/dev/null 2>&1; then
            ldid -S "$BIN" || true
          elif [ -x "$HOME/theos/toolchain/linux/iphone/bin/ldid" ]; then
            "$HOME/theos/toolchain/linux/iphone/bin/ldid" -S "$BIN" || true
          fi
          file "$BIN" | tee "$OUT/binary-info.txt"
          (cd "$OUT" && zip -qry TapeReader-0.1.0-ios6-armv7.ipa Payload)
          DEB="$(find "$PROJECT_ROOT"/packages -type f -name '*.deb' | sort | tail -n1)"
          test -n "$DEB"
          cp "$DEB" "$OUT/TapeReader-0.1.0-ios6-armv7.deb"
          cp /tmp/tapereader-build.log "$OUT/build.log"
          cp /tmp/tapereader-package.log "$OUT/package.log"
          sha256sum "$OUT/TapeReader-0.1.0-ios6-armv7.ipa" "$OUT/TapeReader-0.1.0-ios6-armv7.deb" > "$OUT/SHA256SUMS.txt"
          dpkg-deb -I "$OUT/TapeReader-0.1.0-ios6-armv7.deb" | tee "$OUT/deb-info.txt"
          unzip -l "$OUT/TapeReader-0.1.0-ios6-armv7.ipa" | tee "$OUT/ipa-contents.txt"

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: TapeReader-iOS6-armv7
          path: /tmp/tapereader-out/
          if-no-files-found: error